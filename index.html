<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background: #ffffff;
      }

      .projects {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
      }

      .project {
        width: 200px;
        text-decoration: none;
        color: #000;
      }

      .project img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .project-name {
        margin-top: 15px;
        font-size: 15px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="projects">
      <a
        href="Projects/Restaurant-Menu-website/index.html"
        target="_blank"
        class="project"
      >
        <img src="image/Restaurant_Menu.png" alt="Project 1" />
        <div class="project-name">Restaurant Menu</div>
      </a>

      <a
        href="Projects/Shopnest-Static-Website/index.html"
        target="_blank"
        class="project"
      >
        <img src="image/ShopNest_Store.png" alt="Project 2" />
        <div class="project-name">ShopNest Store</div>
      </a>

      <a
        href="Projects/FlagProject/index.html"
        target="_blank"
        class="project"
      >
        <img src="image/Flag.png" alt="Project 3" />
        <div class="project-name">CSS Flags Gallery</div>
      </a>
    </div>
  </body>
</html>
